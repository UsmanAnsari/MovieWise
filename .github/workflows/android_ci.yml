name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfixes/**'

  pull_request:
    branches:
      - main
      - develop

env:
  # Make secrets available
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Grant execute permission to gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #  Step 5: Decode keystore from base64
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      # Step 6: Create local.properties
      - name: Create local.properties
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > local.properties
          echo "KEYSTORE_FILE=app/release-keystore.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      # Step 7: Cache Gradle packages
      # Speeds up builds by reusing dependencies from previous runs
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 8: Run & Publish unit tests
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Step 9: Run Android lint
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      # Step 10: Build release APK
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # Step 11: Get branch name for artifact naming
      - name: Get branch name
        id: branch_name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          
          # Sanitize branch name: replace / with - and remove other invalid chars
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Original branch: $BRANCH"
          echo "Sanitized branch: $SAFE_BRANCH"

      # Step 12: Upload release APK (main branch only)
      - name: Upload release APK (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: MovieWise-release-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # Step 13: Upload release APK (other branches)
      - name: Upload release APK (feature/bugfixes/hotfixes)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MovieWise-${{ steps.branch_name.outputs.branch }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Step 14: Display APK info
      - name: Display APK info
        run: |
          echo "=== APK Information ==="
          ls -lh app/build/outputs/apk/release/
          echo "APK Size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"
      

      # Step 15: Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
          retention-days: 30

      # Step 16: Upload lint reports
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: app/build/reports/lint-results*.html
          retention-days: 30
          if-no-files-found: warn